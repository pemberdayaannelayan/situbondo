<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mengalihkan ke Perikanan Tangkap</title>
    <!-- Meta refresh: langsung pindah ke URL tujuan -->
    <meta http-equiv="refresh" content="0; url=https://perikanantangkap.situbondokab.go.id/" />
    <!-- Fallback JavaScript jika meta refresh tidak bekerja -->
    <script>
        window.location.href = "https://perikanantangkap.situbondokab.go.id/";
    </script>
</head>
<body>
    <!-- Pesan jika redirect gagal (misal JavaScript mati) -->
    <p style="font-family: sans-serif; text-align: center; margin-top: 50px;">
        Jika tidak dialihkan secara otomatis, 
        <a href="https://perikanantangkap.situbondokab.go.id/">klik di sini</a>.
    </p>
</body>
</html>
